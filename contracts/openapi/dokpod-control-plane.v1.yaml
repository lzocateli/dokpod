openapi: 3.1.0
info:
  title: Dokpod Control Plane API
  version: 1.0.0
  description: Contrato público inicial do cadastro de ambientes do Dokpod.
servers:
  - url: https://localhost:7443
paths:
  /api/v1/environments/{environmentId}/commands/{commandId}:
    get:
      operationId: getContainerCommand
      summary: Consulta o estado de um comando de ciclo de vida
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado atual autorizado do comando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCommandStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/commands:
    post:
      operationId: submitContainerCommand
      summary: Solicita uma ação de ciclo de vida em um container
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Identifica de forma estável a intenção lógica para retries seguros.
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitContainerCommandRequest'
      responses:
        '202':
          description: Comando persistido ou replay idempotente aceito para processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCommandAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers:
    get:
      operationId: listEnvironmentContainers
      summary: Consulta o inventário reconciliado de containers do ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaco retornado pela página anterior.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página autorizada da projeção de inventário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}:
    get:
      operationId: getEnvironment
      summary: Consulta o estado cadastral de um ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado cadastral do ambiente autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: Lista os ambientes autorizados para o usuário
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaco retornado pela página anterior.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de ambientes que o usuário pode consultar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: registerEnvironment
      summary: Cadastra um ambiente
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEnvironmentRequest'
      responses:
        '201':
          description: Ambiente cadastrado.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador técnico opcional para correlação server-side.
  schemas:
    SubmitContainerCommandRequest:
      type: object
      required: [action, expectedContainerRevision, deadlineUtc]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [start, stop, restart, delete]
        expectedContainerRevision:
          type: string
          minLength: 1
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
    ContainerCommandAccepted:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId:
          type: string
          format: uuid
    ContainerCommandStatus:
      type: object
      required:
        - environmentId
        - commandId
        - action
        - containerId
        - expectedContainerRevision
        - state
        - failureCode
        - observedContainerRevision
        - deadlineUtc
        - createdAtUtc
        - updatedAtUtc
        - completedAtUtc
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        action:
          type: string
          enum: [start, stop, restart, delete]
        containerId:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        expectedContainerRevision:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          enum: [pending, dispatched, accepted, succeeded, failed, indeterminate]
        failureCode:
          type: [string, 'null']
          maxLength: 128
        observedContainerRevision:
          type: [string, 'null']
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: [string, 'null']
          format: date-time
    RegisterEnvironmentRequest:
      type: object
      required: [environmentId, name, host]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        host:
          type: string
          minLength: 1
          maxLength: 255
        enabled:
          type: boolean
          default: true
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - environment:read
              - environment:manage
              - container:start
              - container:stop
              - container:restart
              - container:delete
              - audit:read
    EnvironmentCreated:
      type: object
      required: [environmentId]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
    EnvironmentState:
      type: object
      required: [environmentId, name, host, enabled, scopes]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        host:
          type: string
          minLength: 1
          maxLength: 255
        enabled:
          type: boolean
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - environment:read
              - environment:manage
              - container:start
              - container:stop
              - container:restart
              - container:delete
              - audit:read
    EnvironmentPage:
      type: object
      required: [environments]
      additionalProperties: false
      properties:
        environments:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EnvironmentState'
        nextCursor:
          type: [string, 'null']
    InventoryPage:
      type: object
      required: [environmentId, revision, observedAt, ageSeconds, containers]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
        observedAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
          format: int64
          minimum: 0
        containers:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ContainerInventory'
        nextCursor:
          type: [string, 'null']
    ContainerInventory:
      type: object
      required: [containerId, name, imageReference, state, revision, observedAt]
      additionalProperties: false
      properties:
        containerId:
          type: string
        name:
          type: string
        imageReference:
          type: string
        state:
          type: string
        revision:
          type: string
        observedAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
        code:
          type: string
  responses:
    InvalidRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AuthenticationRequired:
      description: Autenticação ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccessDenied:
      description: Decisão do Keycloak negou o cadastro.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: O ambiente já existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: O ambiente não foi encontrado após autorização.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DependencyUnavailable:
      description: Autorização ou persistência indisponível.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'