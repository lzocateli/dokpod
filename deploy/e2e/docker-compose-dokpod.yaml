name: dokpod

services:
  web:
    build:
      context: ../..
      dockerfile: frontend/web/Dockerfile
    image: dokpod-web:e2e
    restart: "no"
    stop_grace_period: 10s
    networks:
      dokpod:
        ipv4_address: 172.32.0.10
        aliases:
          - dokpod-web
      identity-global:
        aliases:
          - dokpod-web

  api:
    build:
      context: ../..
      dockerfile: backend/apps/Dokpod.ControlPlane.Api/Dockerfile
    image: dokpod-api:e2e
    user: "0:0"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOKPOD_API_GRPC_PORT: 7443
      DOKPOD_API_HEALTH_PORT: 8080
      DOKPOD_API_CERTIFICATE_PATH: /certs/api.pfx
      DOKPOD_API_CERTIFICATE_PASSWORD: ${DOKPOD_E2E_API_CERTIFICATE_PASSWORD:-}
      DOKPOD_AGENT_CERTIFICATE_FINGERPRINT: ${DOKPOD_E2E_AGENT_CERTIFICATE_FINGERPRINT:-}
      DOKPOD_AGENT_ENVIRONMENT_ID: ${DOKPOD_E2E_AGENT_ENVIRONMENT_ID:-}
    volumes:
      - ${DOKPOD_E2E_API_CERTIFICATE_PATH:?Defina o caminho absoluto do certificado PFX da API}:/certs/api.pfx:ro
    restart: "no"
    stop_grace_period: 20s
    networks:
      dokpod:
        ipv4_address: 172.32.0.20
        aliases:
          - dokpod-api
      identity-global:
        aliases:
          - dokpod-api

  bff:
    build:
      context: ../..
      dockerfile: backend/apps/Dokpod.Bff/Dockerfile
    image: dokpod-bff:e2e
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Keycloak__Authority: ${KEYCLOAK_PUBLIC_URL:-https://localhost:7443}/realms/${KEYCLOAK_REALM:-dokpod}
      Authentication__Keycloak__ClientId: dokpod-bff
      Authentication__Keycloak__ClientSecret: ${KEYCLOAK_BFF_CLIENT_SECRET:?Defina KEYCLOAK_BFF_CLIENT_SECRET no secret externo}
      Security__AllowedOrigins__0: https://localhost:7443
      Downstream__Api__BaseUrl: http://api:8080
    volumes:
      - dokpod-bff-keys:/var/lib/dokpod-bff
    depends_on:
      api:
        condition: service_started
    restart: "no"
    stop_grace_period: 20s
    networks:
      dokpod:
        aliases:
          - dokpod-bff
      identity-global:
        aliases:
          - dokpod-bff

  agent:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    image: dokpod-agent:e2e
    profiles:
      - agent
    group_add:
      - "0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/lib/dokpod-agent:rw,noexec,nosuid,size=16m,uid=1654,gid=1654,mode=0700
    volumes:
      - /var/run/docker.sock:/run/docker.sock
    environment:
      DOKPOD_AGENT_RUN_ONCE: "true"
      DOKPOD_AGENT_DATA_DIRECTORY: /var/lib/dokpod-agent
      DOKPOD_AGENT_DOCKER_SOCKET: /run/docker.sock
    restart: "no"

networks:
  dokpod:
    ipam:
      config:
        - subnet: 172.32.0.0/24
  identity-global:
    external: true
    name: identity-global

volumes:
  dokpod-bff-keys: